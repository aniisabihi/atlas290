<!doctype html>
<!--
  The page Cloudflare Pages serves, with a real 404 status, for any path that matches no file.

  It has to exist. Without a top-level 404.html, Pages "assumes you are deploying a single-page
  application" and matches every unmatched path to `/` — so `/en/atlantis-9999/` answered 200
  with the root page, whose script then redirected to the front page. A mistyped link looked
  exactly like a working one, and a crawler could index unlimited distinct URLs all serving the
  same document. See docs/decisions/0007-the-404-that-was-not.md.

  It lives in `public/` rather than being generated, because Cloudflare looks for it at the root
  of the output and nothing about it changes when the data does.

  Deliberately static and bilingual: there is no language in a path that matched nothing, so
  guessing one would be inventing information. No script, in particular no redirect — a visitor
  who mistyped needs to be told, not moved.
-->
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sidan finns inte · Page not found · Atlas 290</title>
    <meta name="description" content="Adressen finns inte. This address does not exist." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /*
       * Self-contained: this page is served by the host without the bundle, so it carries its own
       * copy of the tokens it needs rather than importing the site's stylesheet. Same faces, same
       * palette, same three theme states.
       */
      @font-face {
        font-family: 'Newsreader';
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url('/fonts/newsreader-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Plex Sans';
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url('/fonts/plex-sans-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Plex Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/plex-mono-400.woff2') format('woff2');
      }

      :root {
        color-scheme: light;
        --bg: #edeff2;
        --text: #111a22;
        --text-muted: #545f6a;
        --accent: #08519c;
        --border: #c9cfd6;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: #0f141a;
          --text: #e9eef4;
          --text-muted: #9fabb8;
          --accent: #7fb5e4;
          --border: #262f3a;
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0f141a;
        --text: #e9eef4;
        --text-muted: #9fabb8;
        --accent: #7fb5e4;
        --border: #262f3a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 1rem;
        text-align: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font-family:
          'Plex Sans',
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 16px;
        line-height: 1.55;
      }
      main {
        display: grid;
        gap: 1rem;
        justify-items: center;
      }
      h1 {
        margin: 0;
        font-family: 'Newsreader', Georgia, serif;
        font-weight: 400;
        font-size: clamp(1.7rem, 4vw, 2.4rem);
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        max-width: 38rem;
      }
      .quiet {
        color: var(--text-muted);
        font-size: 0.92rem;
      }
      code {
        font-family: 'Plex Mono', ui-monospace, Menlo, monospace;
        font-size: 0.86em;
      }
      .ways {
        display: flex;
        gap: 1.25rem;
        font-size: 1.05rem;
      }
      a {
        color: var(--accent);
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <!-- A landmark, even on a page this small: axe's best-practice rules require all content to
         sit inside one, and the rest of the site is held to the same scan. -->
    <main>
      <h1>Sidan finns inte · Page not found</h1>
      <p class="quiet" lang="sv">
        Adressen pekar inte på någon av de 290 kommunerna. Kommunsidor ser ut så här:
        <code>/sv/malmo-1280/</code>
      </p>
      <p class="quiet" lang="en">
        This address does not name one of the 290 municipalities. A municipality page looks like
        this: <code>/en/malmo-1280/</code>
      </p>
      <p class="ways">
        <a href="/sv/" hreflang="sv" lang="sv">Till kartan</a> ·
        <a href="/en/" hreflang="en" lang="en">To the map</a>
      </p>
    </main>
  </body>
</html>
