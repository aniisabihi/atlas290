<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas 290 · Sveriges kommuner i data</title>
    <meta
      name="description"
      content="Utforska Sveriges 290 kommuner genom SCB:s mått, år för år från 1968 till i dag."
    />
    <!-- vite-ignore keeps Vite from treating these as asset paths to resolve: "/sv/" is a
         directory, and without it the production build fails with EISDIR. Vite strips the
         attribute from the output. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate" hreflang="sv" href="/sv/" vite-ignore />
    <link rel="alternate" hreflang="en" href="/en/" vite-ignore />
    <link rel="alternate" hreflang="x-default" href="/" vite-ignore />
    <script>
      // Applies a stored theme choice BEFORE the first paint, so a visitor who chose dark never
      // sees a white flash on the way in. Deliberately inline and tiny: a separate file would be
      // one more request in front of the paint it exists to protect. The key matches THEME_KEY in
      // src/state/theme.ts, and a test asserts the two never drift apart.
      try {
        var t = localStorage.getItem('atlas-theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
