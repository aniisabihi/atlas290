<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sveriges kommuner i data</title>
    <meta
      name="description"
      content="Utforska Sveriges 290 kommuner genom tio mått från SCB, år för år från 1968 till idag."
    />
    <!-- vite-ignore keeps Vite from treating these as asset paths to resolve: "/sv/" is a
         directory, and without it the production build fails with EISDIR. Vite strips the
         attribute from the output. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate" hreflang="sv" href="/sv/" vite-ignore />
    <link rel="alternate" hreflang="en" href="/en/" vite-ignore />
    <link rel="alternate" hreflang="x-default" href="/" vite-ignore />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
