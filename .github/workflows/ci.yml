name: CI

# Every pull request, and every push to main. Free for public repositories on standard runners,
# with no minute limit — checked against GitHub's billing documentation, not assumed.
on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first: nobody needs the results of a commit that
# has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before setup-node, so that its `cache: yarn` can find the Yarn 4 this project pins in
      # package.json's packageManager field. The runner image ships a Node that can run corepack.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # --immutable fails if yarn.lock would change, so a pull request cannot quietly install
      # something other than what was reviewed.
      - run: yarn install --immutable

      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn build

      # The kitchen's central promise: publishing twice from the same frozen SCB responses gives
      # byte-identical output. Checked by hand at the end of three plans; checked here from now
      # on. `publish` refuses to reach the network itself, so this also proves it stayed offline.
      - name: The pantry rebuilds byte-identically
        run: |
          yarn kitchen publish
          if [ -n "$(git status --porcelain public/pantry/)" ]; then
            echo "::error::Publishing from the committed frozen data changed the pantry."
            echo "Determinism is a requirement, not an aspiration. The diff:"
            git --no-pager diff --stat public/pantry/
            git --no-pager diff public/pantry/ | head -100
            exit 1
          fi
          echo "Pantry reproduced byte for byte."

  browsers:
    name: Keyboard and accessibility in three real browsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable

      # The browser binaries are hundreds of megabytes and change only with Playwright itself, so
      # the cache key is its resolved version rather than the lockfile hash.
      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # The key names the browser SET, not just the Playwright version. This job installs three
      # engines and the budget job installs one; a shared key meant whichever ran first decided
      # what the other found, and a cache holding only Chromium made this job skip its install and
      # then fail to launch Firefox.
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-firefox-webkit
      - name: Install browsers
        run: yarn playwright install --with-deps chromium firefox webkit
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - name: Install system dependencies for the cached browsers
        run: yarn playwright install-deps chromium firefox webkit
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # playwright.config.ts builds the site and serves `dist`, so these run against exactly what
      # a visitor would get rather than against the dev server.
      - run: yarn e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  budget:
    name: Performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable

      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Chromium only, and the key says so — see the note in the browsers job.
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - run: yarn playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      # A cache hit restores the binary but not the system libraries it links against, and a
      # runner image is rebuilt regularly. Same reasoning as the browsers job above.
      - run: yarn playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - run: yarn build
      - name: Serve the built site and measure it
        run: |
          yarn preview --port 4173 --strictPort &
          npx wait-on http://localhost:4173/en/ --timeout 60000
          yarn budget http://localhost:4173/en/

  deploy:
    name: Deploy to Cloudflare Pages
    # Only on main, and only once every check above has passed. This is the whole reason the
    # architect chose to deploy from Actions rather than let Cloudflare build from git: Cloudflare
    # would publish whatever lands on main, and a red build and a live site could coexist.
    needs: [check, browsers, budget]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      # The Cloudflare Pages project name, which is also the hostname it is served from. Declared
      # once because two things need it and they must not drift: the deploy target, and the
      # absolute origin the link previews are built against. Changing this name changes the site's
      # address, so it is a decision, not a setting — docs/decisions/0006-the-name.md.
      PAGES_PROJECT: atlas290
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable

      # Secrets cannot be read in a job-level `if`, so the check happens here. A repository that
      # has not been connected to Cloudflare yet SKIPS with an explanation rather than failing: a
      # permanently red badge on an otherwise healthy project teaches everyone to ignore the badge.
      - name: Is Cloudflare configured?
        id: configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set on this repository, so there is nowhere to deploy to. README.md has the steps. Everything else on this commit passed."
          fi

      # SITE_ORIGIN is what makes og:image and canonical absolute. Without it the pages are still
      # correct but no crawler can resolve the preview image, so a pasted link shows no card.
      - run: yarn build
        if: steps.configured.outputs.ready == 'true'
        env:
          SITE_ORIGIN: https://${{ env.PAGES_PROJECT }}.pages.dev

      - name: Publish
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler is a pinned devDependency rather than a third-party action, so what runs here
          # is whatever yarn.lock says and nothing else.
          yarn wrangler pages deploy dist \
            --project-name="$PAGES_PROJECT" \
            --branch=main
